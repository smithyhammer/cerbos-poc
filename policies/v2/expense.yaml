apiVersion: api.cerbos.dev/v1
resourcePolicy:
  # Proposed rules. Evaluated only when a request asks for policyVersion "v2";
  # the unversioned files in the parent folder remain the "default" version.
  resource: expense
  version: v2
  importDerivedRoles:
    - expense_derived_roles
  rules:
    # Admins can do anything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # Any employee or manager can create an expense
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["employee", "manager"]

    # Owners can view their own expenses; department managers can view
    # any expense in their department
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner", "department_manager"]

    # CHANGED in v2: the manager approval limit drops from $10,000 to $5,000
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["department_manager"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.status == "SUBMITTED"
              - expr: request.resource.attr.amount <= 5000
              - expr: request.resource.attr.ownerId != request.principal.id

    # CHANGED in v2: owners can also withdraw (delete) a SUBMITTED expense
    # until it is approved
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]
      condition:
        match:
          expr: request.resource.attr.status in ["DRAFT", "SUBMITTED"]
