apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: expense
  version: default
  importDerivedRoles:
    - expense_derived_roles
  rules:
    # Admins can do anything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # Any employee or manager can create an expense
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["employee", "manager"]

    # Owners can view their own expenses; department managers can view
    # any expense in their department
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner", "department_manager"]

    # Department managers can approve SUBMITTED expenses up to $10,000,
    # but never their own
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      derivedRoles: ["department_manager"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.status == "SUBMITTED"
              - expr: request.resource.attr.amount <= 10000
              - expr: request.resource.attr.ownerId != request.principal.id

    # Owners can delete their own expenses only while still in DRAFT
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]
      condition:
        match:
          expr: request.resource.attr.status == "DRAFT"
